name: Fetch Launcher Task
on:
  schedule:
    - cron: "0 */5 * * *"  # 每5小时执行一次(UTC时间)
  workflow_dispatch: # 允许网页手动点按钮立即运行

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Execute fetch script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python auto_fetch_launcher.py


name: Update Launcher List
on:
  push:
    paths:
      - 'scrape.py'
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run python scrape
        run: python3 scrape.py

      - name: Commit and push
        run: |
            git config --global user.name "github‑actions[bot]"
            git config --global user.email "github‑actions[bot]@users.noreply.github.com"
            git add list.json
            git commit -m "auto update list.json" || echo "no changes"
            git push
